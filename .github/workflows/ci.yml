name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install libomp for LightGBM
        run: sudo apt-get update && sudo apt-get install -y libgomp1

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The suite runs entirely on the synthetic bundle, so CI never needs the
      # 700 MB IEEE-CIS download. The generators and metrics under test are the
      # same objects the real run uses.
      - name: Test
        run: pytest -q
