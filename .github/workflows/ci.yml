name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install libomp for LightGBM
        run: sudo apt-get update && sudo apt-get install -y libgomp1

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The suite runs entirely on the synthetic bundle, so CI never needs the
      # 700 MB IEEE-CIS download. The generators and metrics under test are the
      # same objects the real run uses.
      - name: Test
        run: pytest -q

  # Every number in the README is produced by pandas. If the aggregation in
  # experiments/03_tables.py were wrong, nothing downstream would notice,
  # because every table and figure reads the same output. These recompute the
  # published ranking from the trial level data in four other languages and
  # require agreement. Each toolchain below is already on the runner image
  # except R, so this adds build time rather than install time.
  cross-language:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install R if the image does not carry it
        run: |
          command -v Rscript >/dev/null || {
            sudo apt-get update && sudo apt-get install -y --no-install-recommends r-base-core
          }
          Rscript --version

      - name: Versions
        run: |
          sqlite3 --version | cut -d" " -f1
          gcc --version | head -1
          go version
          cargo --version
          node --version
          Rscript --version

      - name: Recompute the published ranking in every language
        run: ./verify/verify.sh

      # A check that cannot fail is not evidence. Corrupt the published table,
      # require the harness to reject it, then put it back and require a pass.
      - name: The harness rejects a corrupted results file
        run: |
          cp reports/real_ranking.csv /tmp/rank.bak
          sed -i "s/^mmd,0.18897136306247203,/mmd,0.18997136306247203,/" reports/real_ranking.csv
          if ./verify/verify.sh > /tmp/corrupt.log 2>&1; then
            echo "the harness passed on a corrupted ranking"
            cat /tmp/corrupt.log
            cp /tmp/rank.bak reports/real_ranking.csv
            exit 1
          fi
          echo "rejected the corrupted ranking, as it should"
          cp /tmp/rank.bak reports/real_ranking.csv
          ./verify/verify.sh > /dev/null

      # The same for the table behind the leave-one-archetype-out claim, which
      # only the JavaScript check reads.
      - name: The harness rejects a corrupted leave-one-archetype-out table
        run: |
          cp reports/real_leave_one_archetype_out.csv /tmp/loo.bak
          sed -i "s/^dilution_shift,wasserstein,/dilution_shift,mmd,/" reports/real_leave_one_archetype_out.csv
          if ./verify/verify.sh > /tmp/corrupt2.log 2>&1; then
            echo "the harness passed on a corrupted leave-one-archetype-out table"
            cat /tmp/corrupt2.log
            cp /tmp/loo.bak reports/real_leave_one_archetype_out.csv
            exit 1
          fi
          echo "rejected the corrupted table, as it should"
          cp /tmp/loo.bak reports/real_leave_one_archetype_out.csv
          ./verify/verify.sh > /dev/null

